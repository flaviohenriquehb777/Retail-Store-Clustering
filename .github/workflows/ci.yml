name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint + Testes (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --extra dev

      - name: "Lint (erros críticos — sintaxe, nomes indefinidos, comparações inválidas)"
        run: uv run ruff check .

      - name: Testes automatizados
        run: uv run pytest
