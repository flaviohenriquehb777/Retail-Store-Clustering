[project]
name = "retail-store-clustering"
version = "0.1.0"
description = "Clusterização de Lojas de Varejo para Definição de Metas e Gestão por Pares"
readme = "README.md"
authors = [
    { name = "Flávio Henrique Barbosa", email = "flaviohenriquehb777@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "kneed>=0.8.5",
    "unidecode>=1.3.6",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "watermark>=2.4.3",
]

[project.scripts]
retail-store-clustering = "retail_store_clustering:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100
